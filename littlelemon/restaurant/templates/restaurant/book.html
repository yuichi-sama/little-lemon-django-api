<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Lemon — Make a reservation</title>
</head>
<body>
  <main>
    <h1>Make a reservation</h1>
    <form id="booking-form" method="post">
      {% csrf_token %}
      <label for="first_name">First name</label>
      <input id="first_name" name="first_name" type="text" required>

      <label for="reservation_date">Reservation date</label>
      <input id="reservation_date" name="reservation_date" type="date" required>

      <label for="reservation_slot">Reservation slot</label>
      <select id="reservation_slot" name="reservation_slot" required>
        <option value="">Choose a time</option>
        <!-- TODO: Add the time slots required by your implementation. -->
      </select>

      <button type="submit">Reserve</button>
    </form>

    <section aria-live="polite">
      <h2 id="bookings-heading">Bookings</h2>
      <ul id="booking-list"></ul>
      <p id="no-booking" hidden>No Booking</p>
    </section>
  </main>
  {% load static %}
  <script src="{% static 'restaurant/js/booking.js' %}" defer></script>
</body>
</html>
