<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>All Reservations</title></head>
<body>
  <h1>All Reservations</h1>
  <pre id="reservations-json">Loading…</pre>
  {% load static %}
  <script>
    // TODO: Use Fetch API to retrieve the reservations JSON endpoint and render it.
    fetch("{% url 'restaurant:reservations' %}")
      .then(response => response.json())
      .then(data => {
        document.getElementById("reservations-json").textContent =
          JSON.stringify(data, null, 2);
      })
      .catch(() => {
        document.getElementById("reservations-json").textContent =
          "Could not load reservations.";
      });
  </script>
</body>
</html>
